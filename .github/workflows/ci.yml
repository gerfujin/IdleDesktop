# The name shown in the "Actions" tab on GitHub.
name: CI

# When to run: on every push to main and on every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # A job is a group of steps that run one after another on the same machine.
  build-and-test:
    # WinForms projects can only be built on Windows, so use a Windows runner.
    runs-on: windows-latest

    steps:
      # Download the repository's code onto the runner.
      - name: Checkout code
        uses: actions/checkout@v7

      # Install the .NET 10 SDK (the latest 10.0.x patch release).
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Download NuGet packages. With no path given, dotnet uses the .sln in the repo root.
      - name: Restore dependencies
        run: dotnet restore

      # Compile everything in Release mode; packages were already restored above.
      - name: Build
        run: dotnet build --no-restore -c Release

      # Run the xUnit tests against the Release build from the previous step.
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal
